[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "organise-sra"
version = "0.3.0"
description = "Inventory a taxon's NCBI SRA raw data: RunInfo + sample attributes + taxonomy + data type, Excel report, run list and resumable batch download via kingfisher"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [{name = "Deyuan Yang"}]
keywords = ["SRA", "NCBI", "metadata", "taxonomy", "genome skimming", "kingfisher", "bioinformatics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]

[project.scripts]
organise-sra = "organise_sra.cli:main"

[project.urls]
Homepage = "https://github.com/deyuanyang92-dev/organise_sra"
Issues = "https://github.com/deyuanyang92-dev/organise_sra/issues"

[tool.setuptools.package-data]
organise_sra = ["rules.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
ignore_missing_imports = true
